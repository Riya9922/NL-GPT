# Streamlit Cloud Configuration
# This file tells Streamlit how to run the app

[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = true

[browser]
serverAddress = "0.0.0.0"
serverPort = 8501

[theme]
primaryColor = "#06bcee"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#262730"
